name: Release

# Builds distributable packages. Push a tag like `v1.0.0` to publish a GitHub release,
# or run the workflow manually to get the packages as build artifacts only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    name: Windows (portable + installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.$GITHUB_RUN_NUMBER"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Publish single-file executable
        run: >
          dotnet publish src/MkOptic -c Release -r win-x64
          -p:PublishSingleFile=true -p:DebugType=none -p:Version=${{ steps.version.outputs.value }}
          -o publish/win-x64

      - name: Portable build
        shell: bash
        run: |
          mkdir -p artifacts
          cp publish/win-x64/MkOptic.exe "artifacts/MkOptic-${{ steps.version.outputs.value }}-win-x64-portable.exe"

      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.version.outputs.value }}" `
            "/DSourceExe=$env:GITHUB_WORKSPACE\publish\win-x64\MkOptic.exe" `
            packaging\windows\mkoptic.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/*.exe
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.rid }} (deb + rpm)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            arch: x64
          - rid: linux-arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.$GITHUB_RUN_NUMBER"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm ruby
          sudo gem install --no-document fpm

      - name: Publish
        run: >
          dotnet publish src/MkOptic -c Release -r ${{ matrix.rid }} --self-contained
          -p:DebugType=none -p:Version=${{ steps.version.outputs.value }}
          -o publish/${{ matrix.rid }}

      - name: Build deb and rpm
        run: bash packaging/linux/build-packages.sh "${{ steps.version.outputs.value }}" "publish/${{ matrix.rid }}" "${{ matrix.arch }}" artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: |
            artifacts/*.deb
            artifacts/*.rpm
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }} (dmg)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            arch: arm64
          - rid: osx-x64
            arch: x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.$GITHUB_RUN_NUMBER"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: >
          dotnet publish src/MkOptic -c Release -r ${{ matrix.rid }} --self-contained
          -p:DebugType=none -p:Version=${{ steps.version.outputs.value }}
          -o publish/${{ matrix.rid }}

      - name: Build app bundle and dmg
        run: bash packaging/macos/build-dmg.sh "${{ steps.version.outputs.value }}" "publish/${{ matrix.rid }}" "${{ matrix.arch }}" artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: artifacts/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "$GITHUB_REF_NAME" --generate-notes
